name: Validated Content Generation

on:
  schedule:
    # Research can run frequently elsewhere; production candidates are batched daily.
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: validated-content-generation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate candidate content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx tsx scripts/run-local.ts

      - name: Detect candidate changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- content/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new candidate content was generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Validate all content
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate:content

      - name: Run test suite
        if: steps.changes.outputs.changed == 'true'
        run: npm test -- --run

      - name: Build complete site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Open validated content pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/content-${GITHUB_RUN_ID}"
          git config user.name "nextgengear-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add content/
          git commit -m "content: add validated daily candidate"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Validated content candidate $(date -u +%Y-%m-%d)" \
            --body $'## Automated content candidate\n\nThis candidate passed the repository typecheck, full content compiler, test suite, and production build before the pull request was opened.\n\nProduction is unchanged until this pull request is reviewed and merged.'
