name: Validated Content Generation

on:
  schedule:
    # Research may run elsewhere; production candidates are batched daily.
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: validated-content-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate candidate content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx tsx scripts/run-local.ts

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- content/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new candidate content was generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Validate all content
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate:content

      - name: Run test suite
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Build complete site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push validated content
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "nextgengear-bot"
          git config user.email "bot@nextgengear.cc"
          git config merge.topiclog.name "union topic log entries"
          git config merge.topiclog.driver "node scripts/merge-topic-log.mjs %O %A %B"

          git add content/
          if git diff --cached --quiet; then
            echo "Validation produced no committable content changes."
            exit 0
          fi

          git commit -m "post: $(date -u +%Y-%m-%dT%H:%MZ) validated dispatch"
          branch="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}; the Pages workflow will publish the commit."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${branch}."
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              echo "Rebase failed on attempt ${attempt}." >&2
            fi
          done

          echo "Failed to push validated content after five attempts." >&2
          exit 1
