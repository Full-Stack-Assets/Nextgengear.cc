name: Validated Content Generation

on:
  schedule:
    # Research can run frequently elsewhere; production candidates are batched daily.
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: validated-content-generation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate candidate content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx tsx scripts/run-local.ts

      - name: Commit and push generated content
        shell: bash
        run: |
          if git diff --quiet -- content/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new candidate content was generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Validate all content
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate:content

      - name: Run test suite
        if: steps.changes.outputs.changed == 'true'
        run: npm test -- --run

      - name: Build complete site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

          git commit -m "post: $(date -u +%Y-%m-%dT%H:00Z) hourly dispatch"

          branch="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}. GitHub Pages will deploy from the resulting push."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${branch} and retrying..."
            git fetch origin "${branch}"

            if ! git rebase "origin/${branch}"; then
              echo "Rebase did not complete cleanly; aborting this attempt." >&2
              git rebase --abort || true
            fi
          done

          echo "Failed to push after multiple attempts." >&2
          exit 1
