name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Capture audit report
        shell: bash
        run: |
          npm audit --json > dependency-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(vulnerabilities, null, 2));
          const critical = Number(vulnerabilities.critical ?? 0);
          if (critical > 0) {
            console.error(`Critical dependency vulnerabilities: ${critical}`);
            process.exit(1);
          }
          NODE
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
