name: Content check

# Safety net for the content pipeline: compiles every content/posts/*.mdx with
# the same engine the site builds with (next-mdx-remote) and fails if any post
# is malformed. The in-pipeline `validateMdx` guard is the primary defense;
# this catches anything that still lands in the repository so a broken post
# surfaces here instead of breaking the production `next build` prerender.

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
  pull_request:
    paths:
      - 'content/posts/**'
  workflow_dispatch:

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all posts compile as MDX
        run: npm run validate:content
