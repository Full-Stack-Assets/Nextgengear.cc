name: Apply critical dev dependency remediation

on:
  push:
    branches:
      - codex/dependency-security-audit
    paths:
      - .github/workflows/apply-critical-dev-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dependency-security-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Upgrade coordinated Vitest packages
        run: npm install --save-dev --save-exact vitest@4.1.10 @vitest/coverage-v8@4.1.10
      - name: Verify dependency graph
        run: |
          npm ls vitest @vitest/coverage-v8
          npm audit --audit-level=critical
      - name: Verify repository
        run: |
          npm run typecheck
          npm test
          npm run validate:content
          npm run build
      - name: Commit lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dependency-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already match the remediated versions."
            exit 0
          fi
          git commit -m "chore: remediate critical Vitest advisories"
          git push origin HEAD:codex/dependency-security-audit
